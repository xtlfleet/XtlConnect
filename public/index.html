<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentification Firebase</title>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f7f7f7;
    }

    .auth-container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .message {
      text-align: center;
      margin-top: 20px;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <h1>Authentification</h1>

    <!-- Formulaire de connexion -->
    <div id="login-form">
      <h2>Se connecter</h2>
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Mot de passe" required>
      <button onclick="signIn()">Se connecter</button>
      <p>Pas encore de compte ? <a href="javascript:void(0);" onclick="showSignUpForm()">Créer un compte</a></p>
    </div>

    <!-- Formulaire d'inscription -->
    <div id="signup-form" style="display: none;">
      <h2>Créer un compte</h2>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Mot de passe" required>
      <button onclick="signUp()">S'inscrire</button>
      <p>Déjà un compte ? <a href="javascript:void(0);" onclick="showLoginForm()">Se connecter</a></p>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
   // Configuration de Firebase
   const firebaseConfig = {
            apiKey: "AIzaSyB2Ajhxbrsp9mKQoX86WIu_Eet0JgeWe8o",
            authDomain: "xtlauth-44fcc.firebaseapp.com",
            projectId: "xtlauth-44fcc",
            storageBucket: "xtlauth-44fcc.firebasestorage.app",
            messagingSenderId: "445959408494",
            appId: "1:445959408494:web:1e99041bb8765571eecf7f"
        };

    // Initialiser Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Afficher le formulaire d'inscription
    function showSignUpForm() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('signup-form').style.display = 'block';
      document.getElementById('message').textContent = '';
    }

    // Afficher le formulaire de connexion
    function showLoginForm() {
      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('message').textContent = '';
    }

    // Inscription avec email et mot de passe
    function signUp() {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log("Utilisateur créé :", user.email);
          document.getElementById('message').textContent = "Inscription réussie !";
          document.getElementById('message').className = 'message success';
          window.location.href = "/home";  // Rediriger après inscription réussie
        })
        .catch((error) => {
          console.error("Erreur lors de l'inscription :", error.message);
          document.getElementById('message').textContent = error.message;
          document.getElementById('message').className = 'message error';
        });
    }

    // Connexion avec email et mot de passe
    function signIn() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log("Utilisateur connecté :", user.email);
          document.getElementById('message').textContent = "Connexion réussie !";
          document.getElementById('message').className = 'message success';
          window.location.href = "https://sites.google.com/view/xtlfleet/home";  // Rediriger après connexion réussie
        })
        .catch((error) => {
          console.error("Erreur lors de la connexion :", error.message);
          document.getElementById('message').textContent = error.message;
          document.getElementById('message').className = 'message error';
        });
    }

    // Vérifier l'état d'authentification
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Utilisateur connecté
        console.log("Utilisateur connecté :", user.email);
        window.location.href = "https://sites.google.com/view/xtlfleet/home";  // Rediriger si l'utilisateur est déjà connecté
      } else {
        // Utilisateur non connecté
        console.log("Utilisateur non authentifié");
      }
    });
  </script>

</body>
</html>
