<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentification Firebase</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f7f7f7;
    }

    .auth-container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .message {
      text-align: center;
      margin-top: 20px;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <h1>Authentification</h1>

    <!-- Formulaire de connexion -->
    <div id="login-form">
      <h2>Se connecter</h2>
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Mot de passe" required>
      <button id="login-btn">Se connecter</button>
      <p>Pas encore de compte ? <a href="javascript:void(0);" id="show-signup-form">Créer un compte</a></p>
    </div>

    <!-- Formulaire d'inscription -->
    <div id="signup-form" style="display: none;">
      <h2>Créer un compte</h2>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Mot de passe" required>
      <button id="signup-btn">S'inscrire</button>
      <p>Déjà un compte ? <a href="javascript:void(0);" id="show-login-form">Se connecter</a></p>
    </div>

    <div id="message" class="message"></div>
  </div>

  <!-- Importation des modules Firebase -->
  <script type="module">
    // Importation des modules nécessaires de Firebase
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js';

    
 // Configuration de Firebase
   const firebaseConfig = {
        apiKey: "AIzaSyB2Ajhxbrsp9mKQoX86WIu_Eet0JgeWe8o",
        authDomain: "xtlauth-44fcc.firebaseapp.com",
        projectId: "xtlauth-44fcc",
        storageBucket: "xtlauth-44fcc.firebasestorage.app",
        messagingSenderId: "445959408494",
        appId: "1:445959408494:web:1e99041bb8765571eecf7f"
    };

    // Initialiser Firebase
    const app = initializeApp(firebaseConfig);

    // Initialiser l'authentification Firebase
    const auth = getAuth(app);

    // Fonction d'inscription
    function signUp() {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log("Utilisateur créé :", user.email);
          document.getElementById('message').textContent = "Inscription réussie !";
          document.getElementById('message').className = 'message success';
          window.location.href = "/home";  // Redirection après inscription réussie
        })
        .catch((error) => {
          console.error("Erreur lors de l'inscription :", error.message);
          document.getElementById('message').textContent = error.message;
          document.getElementById('message').className = 'message error';
        });
    }

    // Fonction de connexion
    function signIn() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log("Utilisateur connecté :", user.email);
          document.getElementById('message').textContent = "Connexion réussie !";
          document.getElementById('message').className = 'message success';
          window.location.href = "https://sites.google.com/view/xtlfleet/home";  // Redirection après connexion réussie
        })
        .catch((error) => {
          console.error("Erreur lors de la connexion :", error.message);
          document.getElementById('message').textContent = error.message;
          document.getElementById('message').className = 'message error';
        });
    }

    // Vérification de l'état de l'utilisateur
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("Utilisateur connecté :", user.email);
        window.location.href = "https://sites.google.com/view/xtlfleet/home";  // Rediriger si l'utilisateur est déjà connecté
      } else {
        console.log("Utilisateur non authentifié");
      }
    });

    // Gestion de l'affichage des formulaires
    document.addEventListener('DOMContentLoaded', () => {
      // Affichage formulaire d'inscription
      document.getElementById('show-signup-form').addEventListener('click', () => {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('signup-form').style.display = 'block';
        document.getElementById('message').textContent = '';
      });

      // Affichage formulaire de connexion
      document.getElementById('show-login-form').addEventListener('click', () => {
        document.getElementById('signup-form').style.display = 'none';
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('message').textContent = '';
      });

      // Ajout des événements pour les boutons
      document.getElementById('signup-btn').addEventListener('click', signUp);
      document.getElementById('login-btn').addEventListener('click', signIn);
    });
  </script>

</body>
</html>
